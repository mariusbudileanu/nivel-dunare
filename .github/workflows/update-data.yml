name: Actualizare date AFDJ

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: afdj-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalare dependențe
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Descărcare surse AFDJ
        id: afdj_download
        shell: bash
        run: |
          curl_common=(
            --fail --show-error --silent --location --compressed
            --retry 3 --retry-all-errors --retry-delay 2
            --connect-timeout 15 --max-time 90
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
            --header "Accept-Language: ro-RO,ro;q=0.9,en;q=0.8"
            --referer "https://www.afdj.ro/ro/cotele-dunarii"
          )
          if curl "${curl_common[@]}" \
              --header "Accept: application/xml,text/xml;q=0.9,*/*;q=0.1" \
              --output "${RUNNER_TEMP}/afdj.xml" \
              "https://www.afdj.ro/ro/tabel_cotele_dunarii/xml" \
            && curl "${curl_common[@]}" \
              --header "Accept: text/html,application/xhtml+xml;q=0.9,*/*;q=0.1" \
              --output "${RUNNER_TEMP}/afdj.html" \
              "https://www.afdj.ro/ro/cotele-dunarii"; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            rm -f "${RUNNER_TEMP}/afdj.xml" "${RUNNER_TEMP}/afdj.html"
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::AFDJ a refuzat conexiunea runnerului GitHub; datele existente rămân nemodificate."
            {
              echo "### Sursa AFDJ indisponibilă"
              echo "Runnerul GitHub a primit HTTP 403. Nu au fost inventate sau rescrise date; este validată ultima captură reală din repository."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Colectare și arhivare AFDJ
        if: steps.afdj_download.outputs.available == 'true'
        run: >-
          python -m scripts.ingest_afdj
          --xml-file "${{ runner.temp }}/afdj.xml"
          --html-file "${{ runner.temp }}/afdj.html"
          --source live-github-actions

      - name: Calcul scoruri prognoze
        run: python -m scripts.calculate_forecast_scores

      - name: Construire date publice
        run: python -m scripts.build_public_data

      - name: Validare repository
        run: python -m scripts.validate_repository

      - name: Teste
        run: python -m unittest discover -s tests -v

      - name: Smoke test site
        run: python -m scripts.smoke_test_site

      - name: Commit date dacă există modificări
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "Nu există modificări de publicat."
            exit 0
          fi
          observation_date=$(python -c "import json; print(json.load(open('data/public/status.json', encoding='utf-8'))['latest_measurement_date'])")
          git commit -m "data: update AFDJ observations ${observation_date}"
          git pull --rebase origin main
          git push origin main

      - name: Artefacte de diagnostic la eșec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afdj-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/archive/diagnostics/**
            data/canonical/ingestion_runs.csv
            data/schema/**

