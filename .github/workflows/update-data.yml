name: Actualizare date AFDJ

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: afdj-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalare dependențe
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Colectare și arhivare AFDJ
        run: python -m scripts.ingest_afdj

      - name: Calcul scoruri prognoze
        run: python -m scripts.calculate_forecast_scores

      - name: Construire date publice
        run: python -m scripts.build_public_data

      - name: Validare repository
        run: python -m scripts.validate_repository

      - name: Teste
        run: python -m unittest discover -s tests -v

      - name: Smoke test site
        run: python -m scripts.smoke_test_site

      - name: Commit date dacă există modificări
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "Nu există modificări de publicat."
            exit 0
          fi
          observation_date=$(python -c "import json; print(json.load(open('data/public/status.json', encoding='utf-8'))['latest_measurement_date'])")
          git commit -m "data: update AFDJ observations ${observation_date}"
          git pull --rebase origin main
          git push origin main

      - name: Artefacte de diagnostic la eșec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afdj-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/archive/diagnostics/**
            data/canonical/ingestion_runs.csv
            data/schema/**

