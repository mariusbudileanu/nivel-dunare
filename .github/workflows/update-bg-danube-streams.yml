name: Update Bulgaria Danube streams

on:
  workflow_dispatch:
    inputs:
      stream:
        description: APPD stream to update
        required: true
        default: manual
        type: choice
        options: [manual, automatic]
  schedule:
    # DST-safe candidate instants. The local Europe/Sofia gate below accepts
    # only 09:15 for the manual stream and 21:15 for the automatic stream.
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"
    - cron: "15 18 * * *"
    - cron: "15 19 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: bg-danube-stream-dispatch
  cancel-in-progress: false

jobs:
  local-time-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      stream: ${{ steps.gate.outputs.stream }}
    steps:
      - name: Resolve Europe/Sofia operational window
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          should_run=false
          stream=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_run=true
            stream="$MANUAL_STREAM"
          else
            local_time=$(TZ=Europe/Sofia date +%H:%M)
            case "$local_time" in
              09:15) should_run=true; stream=manual ;;
              21:15) should_run=true; stream=automatic ;;
            esac
          fi
          {
            echo "should_run=$should_run"
            echo "stream=$stream"
          } >> "$GITHUB_OUTPUT"
          echo "Europe/Sofia time: $(TZ=Europe/Sofia date --iso-8601=seconds); selected stream: ${stream:-skipped}"

  dispatch-validated-publication:
    needs: local-time-gate
    if: needs.local-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the shared fail-soft publisher
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM: ${{ needs.local-time-gate.outputs.stream }}
        run: |
          gh workflow run update-international-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source=bg \
            -f stream="$STREAM" \
            -f mode=live \
            -f action=publish
