name: Update Serbia RHMZ data

on:
  workflow_dispatch:
    inputs:
      profile:
        description: RHMZ component to collect
        required: true
        default: all
        type: choice
        options: [all, nrt, daily, forecast]
      period:
        description: NRT history period (7 overlap, 30 backfill)
        required: true
        default: "7"
        type: choice
        options: ["7", "30"]
      action:
        description: Build a preview or publish validated live data
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
  schedule:
    # NRT latest every three hours and a daily reconciliation overlap.
    - cron: "17 */3 * * *"
    - cron: "47 0 * * *"
    # Daily (target ~10:20 Europe/Belgrade; tightest case 09:20 UTC in
    # winter): three unconditional attempts starting >=1h after that,
    # each a no-op if today's daily data is already collected.
    - cron: "35 10 * * *"
    - cron: "35 12 * * *"
    - cron: "35 14 * * *"
    # Forecast (target ~12:00 Europe/Belgrade; tightest case 11:00 UTC in
    # winter): same pattern.
    - cron: "20 12 * * *"
    - cron: "20 14 * * *"
    - cron: "20 16 * * *"

permissions:
  contents: read

concurrency:
  group: international-danube-data-publication
  cancel-in-progress: false

jobs:
  collect-serbia:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      profile: ${{ steps.resolve.outputs.profile }}
      period: ${{ steps.resolve.outputs.period }}
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve idempotent Serbia collection profile
        id: resolve
        shell: pwsh
        run: |
          $profile = '${{ inputs.profile }}'
          $period = '${{ inputs.period }}'
          $action = '${{ inputs.action }}'
          $shouldRun = 'true'
          if ('${{ github.event_name }}' -eq 'schedule') {
            $action = 'publish'
            $period = '7'
            switch ('${{ github.event.schedule }}') {
              '17 */3 * * *' { $profile = 'nrt' }
              '47 0 * * *' { $profile = 'nrt' }
              '35 10 * * *' { $profile = 'daily' }
              '35 12 * * *' { $profile = 'daily' }
              '35 14 * * *' { $profile = 'daily' }
              '20 12 * * *' { $profile = 'forecast' }
              '20 14 * * *' { $profile = 'forecast' }
              '20 16 * * *' { $profile = 'forecast' }
              default { throw 'Unknown Serbia schedule' }
            }
            if ($profile -eq 'daily' -or $profile -eq 'forecast') {
              # No wall-clock check: a fixed cron paired with "do we
              # already have today's data for this profile?" is immune to
              # GitHub Actions scheduling delay - a late run still either
              # finds fresh data or safely no-ops. A single-line python -c
              # is used deliberately: a multi-line heredoc-style script at
              # column 0 inside this indented YAML block scalar broke
              # yaml.safe_load (block scalars require every content line
              # to stay at or above the block's own indentation) - this is
              # what actually broke this file after the first attempt at
              # this same idempotency check; see the P1 recovery report.
              $alreadyCollectedToday = python -c "import json, datetime; c = json.load(open('data/reference/international_source_operations.json', encoding='utf-8')).get('sources', {}).get('rs', {}).get('components', {}).get('$profile', {}); s = c.get('last_success_at'); print('true' if s and str(s)[:10] == datetime.datetime.now(datetime.timezone.utc).date().isoformat() else 'false')"
              if ($alreadyCollectedToday -eq 'true') { $shouldRun = 'false' }
            }
          }
          $shouldPublish = if ($shouldRun -eq 'true' -and $action -eq 'publish') { 'true' } else { 'false' }
          @(
            "should_run=$shouldRun"
            "should_publish=$shouldPublish"
            "profile=$profile"
            "period=$period"
            "action=$action"
          ) | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Verify Schannel client
        if: steps.resolve.outputs.should_run == 'true'
        shell: pwsh
        run: |
          curl.exe --version
          if ((curl.exe --version | Select-Object -First 1) -notmatch 'Schannel') {
            throw 'curl.exe does not use the expected Windows Schannel backend'
          }

      - name: Collect raw RHMZ payloads and candidate data
        if: steps.resolve.outputs.should_run == 'true'
        shell: pwsh
        run: |
          python -m scripts.collect_rhmz_windows `
            --profile '${{ steps.resolve.outputs.profile }}' `
            --period '${{ steps.resolve.outputs.period }}' `
            --output-dir _handoff/candidates `
            --archive-root _handoff/raw-archive

      - name: Upload immutable Windows handoff
        if: steps.resolve.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: serbia-schannel-handoff-${{ github.run_id }}
          path: _handoff/
          if-no-files-found: error
          retention-days: 30

  validate-and-build:
    needs: collect-serbia
    if: needs.collect-serbia.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      should_publish: ${{ needs.collect-serbia.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: serbia-schannel-handoff-${{ github.run_id }}
          path: _handoff

      - name: Validate handoff and build fail-soft public contract
        shell: bash
        run: |
          set -euo pipefail
          output="_workflow/serbia-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m scripts.update_international_data \
            --source rs --mode live \
            --stream '${{ needs.collect-serbia.outputs.profile }}' \
            --rs-period '${{ needs.collect-serbia.outputs.period }}' \
            --action '${{ needs.collect-serbia.outputs.action }}' \
            --precollected-root _handoff/candidates \
            --precollected-archive _handoff/raw-archive \
            --output-dir "$output"

      - name: Run repository, public, frontend and unit validation
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.validate_repository
          python -m scripts.validate_international_public_data
          python -m scripts.geocode_international_stations --validate-only
          python -m scripts.smoke_test_site
          python -m unittest discover -s tests -v
          git diff --check

      - name: Prepare immutable validated product
        if: needs.collect-serbia.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="_workflow/serbia-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          product="$output/product"
          mkdir -p "$product/data/public" "$product/public/data" "$product/data/reference"
          cp -a data/public/international "$product/data/public/"
          cp -a public/data/international "$product/public/data/"
          cp data/reference/international_source_operations.json "$product/data/reference/"
          printf '%s\n' "$GITHUB_SHA" > "$product/BASE_SHA"
          (cd "$product" && find data public -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload validated Linux product and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serbia-validated-product-${{ github.run_id }}
          path: _workflow/serbia-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [collect-serbia, validate-and-build]
    if: needs.validate-and-build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: serbia-validated-product-${{ github.run_id }}
          path: ${{ runner.temp }}/serbia-validated

      - name: Verify artifact and concurrent international data
        shell: bash
        run: |
          set -euo pipefail
          product="${RUNNER_TEMP}/serbia-validated/product"
          (cd "$product" && sha256sum -c SHA256SUMS)
          base_sha=$(cat "$product/BASE_SHA")
          git fetch origin main
          git merge-base --is-ancestor "$base_sha" origin/main
          concurrent=$(git diff --name-only "$base_sha" origin/main -- data/public/international public/data/international data/reference/international_source_operations.json)
          if [[ -n "$concurrent" ]]; then
            echo "Concurrent international changes detected; refusing overwrite:" >&2
            printf '%s\n' "$concurrent" >&2
            exit 1
          fi
          git checkout -B main origin/main

      - name: Apply strict international product whitelist
        shell: bash
        run: |
          set -euo pipefail
          product="${RUNNER_TEMP}/serbia-validated/product"
          rm -rf data/public/international public/data/international
          cp -a "$product/data/public/international" data/public/
          cp -a "$product/public/data/international" public/data/
          cp "$product/data/reference/international_source_operations.json" data/reference/
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(data/public/international/|public/data/international/|data/reference/international_source_operations\.json$)' || true)
          [[ -z "$unexpected" ]] || { printf '%s\n' "$unexpected" >&2; exit 1; }

      - name: Commit and push validated Serbia data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/public/international public/data/international data/reference/international_source_operations.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update Serbia RHMZ sources $(date -u +%F)"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            git push origin HEAD:main
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages after a real data commit
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy-pages.yml --ref main
